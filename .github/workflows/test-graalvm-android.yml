name: GraalVM on Android

# The example's suites on Android with the façades in a GraalVM native image, which builds on Linux only: on an x86_64
# emulator (KVM), and the arm64 test APK kept for a device
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Test APKs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :examples:calculator:assembleAndroidDeviceTest -Pnja.runtime=GRAALVM -Pnja.androidAbis=arm64-v8a,x86_64 --stacktrace
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :examples:calculator:connectedAndroidDeviceTest -Pnja.runtime=GRAALVM -Pnja.androidAbis=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graalvm-android
          path: |
            examples/calculator/build/outputs/apk/**/*.apk
            examples/calculator/build/reports/androidTests/**
