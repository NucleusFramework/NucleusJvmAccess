name: Release

# A tag v<version> publishes that version: the runtimes (dev.nucleusframework.nja:nja-server, :nja-client) to Maven
# Central, then the Gradle plugins (dev.nucleusframework.nja, dev.nucleusframework.nja.facade) to the Plugin Portal
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # macOS: the client's iOS klibs (cinterop) need Xcode; the runner has the Android SDK too
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # JDK 25: the server's bytecode level (the façades' JVM)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # A run again of a tag (a step after this one failed) skips what is already published
      - name: Publish the runtimes to Maven Central
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -sfI "https://repo1.maven.org/maven2/dev/nucleusframework/nja/nja-client/$version/nja-client-$version.pom" > /dev/null; then
            echo "nja-server and nja-client $version are on Maven Central already"
          else
            ./gradlew --project-dir runtime publishAndReleaseToMavenCentral --no-configuration-cache
          fi
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNINGKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNINGPASSWORD }}

      - name: Publish the plugins to the Gradle Plugin Portal
        run: ./gradlew --project-dir plugin-build setupPluginUploadFromEnvironment publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" > /dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}"
